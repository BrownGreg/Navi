services:
  - type: web
    name: navi-web
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: AI_SERVICE_URL
        # URL du service navi-ai-service une fois deploye sur Render.
        # Format : https://navi-ai-service.onrender.com
        # A remplir dans le dashboard Render apres le premier deploy d'ai-service.
        sync: false
      - key: PORT
        # Render injecte PORT=10000 par defaut, ce qui fait ecouter le
        # serveur Next.js standalone sur 10000 alors que Render route le
        # trafic vers le port declare par EXPOSE dans le Dockerfile (3000)
        # -> 502 Bad Gateway. On force PORT a matcher EXPOSE 3000.
        value: "3000"

  - type: web
    name: navi-ai-service
    env: docker
    dockerfilePath: ./ai-service/Dockerfile
    dockerContext: ./ai-service
    plan: free
    envVars:
      - key: JWT_SECRET
        # Obligatoire — generer avec : openssl rand -base64 32
        sync: false
      - key: AI_SERVICE_DATABASE_URL
        # Pour Render sans disque persistant : utiliser une URL PostgreSQL externe
        # (ex: Render PostgreSQL, Supabase, Neon). En demo/test : sqlite:///./navi.db
        sync: false
      - key: MISTRAL_API_KEY
        # Transcription Voxtral (dictaphone), generation du CR, classification
        # et moderation (Mistral Moderation 2) — https://console.mistral.ai
        sync: false
      - key: MISTRAL_CHAT_MODEL
        value: mistral-small-latest
      - key: MISTRAL_MODERATION_MODEL
        value: mistral-moderation-2603
      - key: VEXA_API_KEY
        # Bot de reunion visio — https://docs.vexa.ai
        sync: false
      - key: VEXA_BASE_URL
        value: https://api.cloud.vexa.ai
      - key: GOOGLE_CLIENT_ID
        # OAuth calendrier auto-join — console.cloud.google.com
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        # Doit pointer vers l'origine publique de navi-web (le service ci-dessus),
        # pas vers cette URL onrender.com d'ai-service. Ex :
        # https://navi-web.onrender.com/api/calendar/google/callback
        sync: false
      - key: MICROSOFT_CLIENT_ID
        # OAuth calendrier auto-join — portal.azure.com
        sync: false
      - key: MICROSOFT_CLIENT_SECRET
        sync: false
      - key: MICROSOFT_TENANT_ID
        value: common
      - key: MICROSOFT_REDIRECT_URI
        # Meme remarque que GOOGLE_REDIRECT_URI : origine navi-web, pas ai-service.
        sync: false
      - key: SCALEWAY_API_KEY
        # Sous-traitant de secours (CR + classification uniquement) si
        # Mistral echoue — optionnel, https://console.scaleway.com
        sync: false
      - key: SENTRY_DSN
        # Monitoring optionnel — creer un projet Python/FastAPI sur sentry.io
        sync: false
