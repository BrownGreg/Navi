services:
  - type: web
    name: scribe-web
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: AI_SERVICE_URL
        # URL du service scribe-ai-service une fois deploye sur Render.
        # Format : https://scribe-ai-service.onrender.com
        # A remplir dans le dashboard Render apres le premier deploy d'ai-service.
        sync: false

  - type: web
    name: scribe-ai-service
    env: docker
    dockerfilePath: ./ai-service/Dockerfile
    dockerContext: ./ai-service
    plan: free
    envVars:
      - key: JWT_SECRET
        # Obligatoire — generer avec : openssl rand -base64 32
        sync: false
      - key: AI_SERVICE_DATABASE_URL
        # Pour Render sans disque persistant : utiliser une URL PostgreSQL externe
        # (ex: Render PostgreSQL, Supabase, Neon). En demo/test : sqlite:///./scribe.db
        sync: false
      - key: MISTRAL_API_KEY
        # Transcription Voxtral (dictaphone), generation du CR et classification
        # — https://console.mistral.ai
        sync: false
      - key: MISTRAL_CHAT_MODEL
        value: mistral-large-latest
      - key: VEXA_API_KEY
        # Bot de reunion visio — https://docs.vexa.ai
        sync: false
      - key: VEXA_BASE_URL
        value: https://api.cloud.vexa.ai
      - key: GROQ_API_KEY
        # Moderation gpt-oss-safeguard-20b — https://console.groq.com
        sync: false
      - key: GPT_OSS_SAFEGUARD_ENDPOINT
        value: https://api.groq.com/openai/v1/chat/completions
      - key: GPT_OSS_SAFEGUARD_MODEL
        value: openai/gpt-oss-safeguard-20b
      - key: GOOGLE_CLIENT_ID
        # OAuth calendrier auto-join — console.cloud.google.com
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        # Doit pointer vers l'origine publique de scribe-web (le service ci-dessus),
        # pas vers cette URL onrender.com d'ai-service. Ex :
        # https://scribe-web.onrender.com/api/calendar/google/callback
        sync: false
      - key: MICROSOFT_CLIENT_ID
        # OAuth calendrier auto-join — portal.azure.com
        sync: false
      - key: MICROSOFT_CLIENT_SECRET
        sync: false
      - key: MICROSOFT_TENANT_ID
        value: common
      - key: MICROSOFT_REDIRECT_URI
        # Meme remarque que GOOGLE_REDIRECT_URI : origine scribe-web, pas ai-service.
        sync: false
